[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-ai-private-client"
version = "0.3.0"
description = "Reverse-engineered Python client for Muse.ai Hatch Noise RPC, based on an authorized browser capture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0",
  "curl_cffi>=0.16.1",
  "httpx>=0.27",
  "mcp>=1.13,<2",
  "fastapi>=0.116",
  "python-multipart>=0.0.20",
  "uvicorn>=0.35",
  "Pillow>=10.0",
  "websockets>=15.0",
  "python-socks[asyncio]>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
muse-ai = "muse_ai.cli:main"
muse-web = "muse_ai.web.app:main"
muse-mcp = "muse_ai.mcp_server:main"

[tool.setuptools.packages.find]
include = ["muse_ai*"]

[tool.setuptools.package-data]
"muse_ai.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
