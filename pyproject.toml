[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-ai-private-client"
version = "0.2.0"
description = "Reverse-engineered Python client for Muse.ai Hatch Noise RPC, based on an authorized browser capture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0",
  "curl_cffi>=0.16.1",
  "httpx>=0.27",
  "Pillow>=10.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
muse-ai = "muse_ai.cli:main"

[tool.setuptools.packages.find]
include = ["muse_ai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
